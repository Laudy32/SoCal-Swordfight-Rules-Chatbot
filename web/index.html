<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoCal Swordfight 2026 — Rules Helper</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #14161c;
    --panel: #1d2029;
    --border: #2e3240;
    --text: #e8e9ee;
    --muted: #9aa0b0;
    --accent: #c0392b;
    --user-bubble: #2a4a6b;
    --bot-bubble: #262a35;
    --error: #e0786c;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    max-width: 720px;
    margin: 0 auto;
    padding: 0 12px;
  }
  header {
    padding: 16px 4px 8px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 1.15rem;
    margin: 0 0 4px;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 0.85rem;
    line-height: 1.4;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px 4px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 85%;
    padding: 10px 13px;
    border-radius: 12px;
    line-height: 1.45;
    font-size: 0.95rem;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    border-bottom-right-radius: 3px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bot-bubble);
    border-bottom-left-radius: 3px;
  }
  .msg.bot.pending { color: var(--muted); }
  .msg.bot.error { color: var(--error); }
  .msg.note {
    align-self: center;
    background: none;
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
    max-width: 100%;
  }
  form {
    display: flex;
    gap: 8px;
    padding: 10px 4px 14px;
    border-top: 1px solid var(--border);
  }
  #question {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 1rem;
  }
  button {
    padding: 10px 16px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: white;
    font-weight: 600;
    font-size: 0.9rem;
  }
  button:disabled {
    background: var(--border);
    color: var(--muted);
  }
</style>
</head>
<body>

<header>
  <h1>SoCal Swordfight 2026 — Rules Helper</h1>
  <p>
    Answers come from the official 2026 ruleset. Questions are sent to an AI
    service (Google Gemini) to be answered, so please don't include personal
    information. For anything high-stakes (a disputed call, safety, equipment
    approval), ask a tournament director.
  </p>
</header>

<div id="messages"></div>

<form id="composer">
  <input id="question" type="text" placeholder="Ask about the rules…" autocomplete="off" maxlength="500">
  <button id="send" type="submit">Ask</button>
</form>

<script>
  // Set this to your Cloudflare Worker's address after deploying it (see worker/README.md).
  const WORKER_URL = "";

  const MAX_HISTORY_TURNS = 6;

  const messagesEl = document.getElementById("messages");
  const form = document.getElementById("composer");
  const input = document.getElementById("question");
  const sendBtn = document.getElementById("send");
  const history = [];

  function addMessage(className, text) {
    const div = document.createElement("div");
    div.className = "msg " + className;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function setBusy(busy) {
    input.disabled = busy;
    sendBtn.disabled = busy;
    if (!busy) input.focus();
  }

  if (!WORKER_URL) {
    addMessage("note", "This page isn't connected to its answer service yet. If you're setting it up, see worker/README.md.");
    setBusy(true);
  } else {
    addMessage("note", "Ask anything about the SoCal Swordfight 2026 rules — scoring, gear, conduct, a specific weapon…");
    input.focus();
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question || !WORKER_URL) return;

    input.value = "";
    setBusy(true);
    addMessage("user", question);
    const botDiv = addMessage("bot pending", "Thinking…");

    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, history: history.slice(-MAX_HISTORY_TURNS) }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.answer) {
        throw new Error(data.error || "Something went wrong. Please try again in a moment.");
      }
      botDiv.className = "msg bot";
      botDiv.textContent = data.answer;
      history.push({ role: "user", text: question }, { role: "assistant", text: data.answer });
    } catch (err) {
      botDiv.className = "msg bot error";
      botDiv.textContent = err instanceof TypeError
        ? "Couldn't reach the rules helper — check your internet connection and try again."
        : err.message;
    }

    messagesEl.scrollTop = messagesEl.scrollHeight;
    setBusy(false);
  });
</script>

</body>
</html>
